name: Auto Update Dependencies

on:
  schedule:
    - cron: '0 5 * * 3'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run dependency updater
        id: updater
        run: |
          bash .github/scripts/update-deps.sh
          if [ -f .github/scripts/BRANCH_NAME ]; then
            echo "BRANCH_NAME=$(cat .github/scripts/BRANCH_NAME)" >> $GITHUB_ENV
          fi

      - name: Create Pull Request (if updates pushed)
        if: env.BRANCH_NAME != ''
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update dependencies across projects"
          branch: ${{ env.BRANCH_NAME }}
          title: "Automated: Update dependencies across projects"
          body: |
            This PR was created automatically by the repository's dependency updater.
            It includes security fixes and dependency version updates across subprojects.